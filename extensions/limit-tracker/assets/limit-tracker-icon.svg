<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="64" y1="30" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="30" y1="20" x2="98" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="128" height="128" rx="28" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Gauge (top arc) -->
  <path d="M30 64 A34 34 0 0 1 98 64" stroke="url(#gaugeGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="64" y1="64" x2="82" y2="48" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="4" fill="#fff"/>
  <!-- Robot mascot -->
  <!-- V-helmet/ears -->
  <path d="M44 38 L64 22 L84 38 L76 48 L52 48 Z" fill="#fff" filter="url(#glow)"/>
  <!-- Head -->
  <rect x="48" y="48" width="32" height="28" rx="10" fill="url(#robotBody)"/>
  <!-- Eyes -->
  <ellipse cx="57" cy="58" rx="4" ry="6" fill="#fff"/>
  <ellipse cx="71" cy="58" rx="4" ry="6" fill="#fff"/>
  <!-- Body -->
  <rect x="52" y="76" width="24" height="20" rx="8" fill="url(#robotBody)"/>
  <!-- Floating cards (glassmorphism) -->
  <rect x="14" y="20" width="22" height="16" rx="5" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.2"/>
  <rect x="92" y="20" width="22" height="16" rx="5" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.2"/>
  <rect x="14" y="92" width="22" height="16" rx="5" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.2"/>
  <rect x="92" y="92" width="22" height="16" rx="5" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.2"/>
  <!-- Progress bars on cards -->
  <rect x="18" y="38" width="14" height="3" rx="1.5" fill="#34d399"/>
  <rect x="96" y="38" width="14" height="3" rx="1.5" fill="#60a5fa"/>
  <rect x="18" y="110" width="14" height="3" rx="1.5" fill="#fbbf24"/>
  <rect x="96" y="110" width="14" height="3" rx="1.5" fill="#a78bfa"/>
  <!-- Bottom dashboard -->
  <rect x="38" y="100" width="52" height="14" rx="4" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.15"/>
  <!-- Mini bar chart -->
  <rect x="44" y="106" width="4" height="6" rx="1" fill="#a78bfa"/>
  <rect x="52" y="104" width="4" height="8" rx="1" fill="#a78bfa"/>
  <rect x="60" y="102" width="4" height="10" rx="1" fill="#a78bfa"/>
  <!-- Percentage -->
  <text x="84" y="111" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#a78bfa">72%</text>
</svg>
