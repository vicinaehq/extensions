<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3b2a8f"/>
      <stop offset="0.55" stop-color="#5b2fc9"/>
      <stop offset="1" stop-color="#8a3fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffb86b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>

  <!-- lens glow, ring and handle -->
  <circle cx="222" cy="222" r="118" fill="url(#glow)"/>
  <circle cx="222" cy="222" r="112" fill="none" stroke="#fff" stroke-width="34"/>
  <path d="M306 306 L392 392" stroke="#fff" stroke-width="46" stroke-linecap="round"/>

  <!-- sparkle answering inside the lens -->
  <path d="M222 148 C228 194 250 216 296 222 C250 228 228 250 222 296 C216 250 194 228 148 222 C194 216 216 194 222 148 Z"
        fill="url(#spark)"/>
  <path d="M396 110 C399 132 410 143 432 146 C410 149 399 160 396 182 C393 160 382 149 360 146 C382 143 393 132 396 110 Z"
        fill="#fff" opacity="0.9"/>
</svg>
